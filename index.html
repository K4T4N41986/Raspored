<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspored Časova II/4</title>

  <!-- PWA Manifest i Meta Tagovi -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Raspored II/4">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs (v10.8.0 Modular CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tvoja Firebase konfiguracija
    const firebaseConfig = {
      apiKey: "AIzaSyA6Aamx-dJcx07KIzIuu9kDS-j04ZF8OGE",
      authDomain: "raspored-5142b.firebaseapp.com",
      projectId: "raspored-5142b",
      storageBucket: "raspored-5142b.firebasestorage.app",
      messagingSenderId: "643929930891",
      appId: "1:643929930891:web:b53a87ea9e6ab2d722a88e",
      measurementId: "G-D8PNRY0BKD"
    };

    // Inicijalizacija
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Default podaci sa slike sa tačnim satnicama
    const defaultData = {
      prepodne: [
        { time: "08:00 - 08:45", pon: "Srpski jezik", uto: "Matematika", sre: "Srpski jezik", cet: "Matematika", pet: "Srpski jezik" },
        { time: "08:50 - 09:35", pon: "Matematika", uto: "Srpski jezik", sre: "Engleski jezik", cet: "Srpski jezik", pet: "Matematika" },
        { time: "09:55 - 10:40", pon: "Muzička kultura", uto: "Svet oko nas", sre: "Fizičko vaspitanje (sala)", cet: "Svet oko nas", pet: "Fizičko vaspitanje" },
        { time: "10:45 - 11:30", pon: "Fizičko vaspitanje", uto: "Likovna kultura", sre: "Matematika", cet: "Verska nastava / Građansko", pet: "Engleski jezik" },
        { time: "11:40 - 12:25", pon: "Digitalni svet", uto: "Likovna kultura", sre: "Dopunska nastava", cet: "-", pet: "-" }
      ],
      poslepodne: [
        { time: "12:30 - 13:15", pon: "Digitalni svet", uto: "Likovna kultura", sre: "Dopunska nastava", cet: "Građansko vaspitanje", pet: "-" },
        { time: "13:20 - 14:05", pon: "Srpski jezik", uto: "Likovna kultura", sre: "Srpski jezik", cet: "Matematika", pet: "Srpski jezik" },
        { time: "14:10 - 14:55", pon: "Matematika", uto: "Matematika", sre: "Engleski jezik", cet: "Srpski jezik", pet: "Fizičko vaspitanje" },
        { time: "15:10 - 15:55", pon: "Muzička kultura", uto: "Srpski jezik", sre: "Matematika", cet: "Svet oko nas", pet: "Matematika" },
        { time: "16:00 - 16:45", pon: "Fizičko vaspitanje", uto: "Svet oko nas", sre: "Fizičko vaspitanje", cet: "Verska nastava", pet: "Engleski jezik" }
      ]
    };

    let scheduleData = JSON.parse(localStorage.getItem('raspored_cache')) || defaultData;
    let isAdmin = false;

    // Funkcija za automatsko izračunavanje smene na osnovu datuma
    function getAutoShift() {
      const now = new Date();
      const targetDate = new Date(now);
      
      // Ako je nedelja i prošlo je 12:00h, prikaži već smenu za sutrašnji ponedeljak
      if (now.getDay() === 0 && now.getHours() >= 12) {
        targetDate.setDate(now.getDate() + 1);
      }
      
      // Referentni ponedeljak: 9. novembar 2026. (Pre podne)
      const refMonday = new Date(2026, 10, 9);
      refMonday.setHours(0,0,0,0);
      const tempDate = new Date(targetDate);
      tempDate.setHours(0,0,0,0);

      const diffMs = tempDate - refMonday;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const diffWeeks = Math.floor(diffDays / 7);

      // Parna nedelja razlike -> prepodne, neparna -> poslepodne
      return (Math.abs(diffWeeks) % 2 === 0) ? 'prepodne' : 'poslepodne';
    }

    let currentShift = getAutoShift();

    // Globalno dostupne funkcije
    window.switchShift = (shift) => {
      currentShift = shift;
      updateShiftButtons();
      renderTable();
    };

    function updateShiftButtons() {
      const btnPrep = document.getElementById('btnPrepodne');
      const btnPosle = document.getElementById('btnPoslepodne');
      if (btnPrep && btnPosle) {
        btnPrep.className = currentShift === 'prepodne' 
          ? "px-5 py-2 rounded-xl text-sm font-semibold bg-cyan-500 text-slate-900 shadow-lg shadow-cyan-500/30 transition-all"
          : "px-5 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition-all";
        btnPosle.className = currentShift === 'poslepodne'
          ? "px-5 py-2 rounded-xl text-sm font-semibold bg-cyan-500 text-slate-900 shadow-lg shadow-cyan-500/30 transition-all"
          : "px-5 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition-all";
      }
    }

    window.openAdminModal = () => {
      document.getElementById('adminModal').classList.remove('hidden');
    };

    window.closeAdminModal = () => {
      document.getElementById('adminModal').classList.add('hidden');
    };

    window.loginAdmin = () => {
      const pin = document.getElementById('adminPin').value;
      if (pin === '1986') { // Podrazumevani PIN: 1986
        isAdmin = true;
        document.getElementById('adminStatus').innerText = "Admin režim aktivan (Klikni na polje za izmenu)";
        document.getElementById('adminStatus').className = "text-xs px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium";
        closeAdminModal();
        renderTable();
      } else {
        alert("Pogrešan PIN kod!");
      }
    };

    window.updateCell = (shift, index, field, value) => {
      scheduleData[shift][index][field] = value;
      saveToFirebase();
    };

    async function saveToFirebase() {
      try {
        await setDoc(doc(db, "schedule", "data"), scheduleData);
        localStorage.setItem('raspored_cache', JSON.stringify(scheduleData));
      } catch (e) {
        console.error("Greška pri čuvanju na Firebase:", e);
        localStorage.setItem('raspored_cache', JSON.stringify(scheduleData));
      }
    }

    function listenToFirebase() {
      onSnapshot(doc(db, "schedule", "data"), (docSnap) => {
        if (docSnap.exists()) {
          scheduleData = docSnap.data();
          localStorage.setItem('raspored_cache', JSON.stringify(scheduleData));
          renderTable();
        } else {
          saveToFirebase();
        }
      }, (error) => {
        console.warn("Firebase sinhronizacija radi offline/lokalno:", error);
        renderTable();
      });
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const data = scheduleData[currentShift] || [];
      const days = ['pon', 'uto', 'sre', 'cet', 'pet'];
      
      tbody.innerHTML = '';
      data.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-700/50 hover:bg-slate-800/40 transition-colors";
        
        let timeCell = `<td class="p-4 font-mono text-xs md:text-sm text-cyan-300 font-semibold whitespace-nowrap">${row.time}</td>`;
        tr.innerHTML = timeCell;

        days.forEach(day => {
          const td = document.createElement('td');
          td.className = "p-3 text-sm text-slate-200 border-l border-slate-700/30";
          
          if (isAdmin) {
            td.innerHTML = `<input type="text" value="${row[day] || ''}" 
              onchange="window.updateCell('${currentShift}', ${rowIndex}, '${day}', this.value)"
              class="w-full bg-slate-900/80 border border-cyan-500/50 rounded p-1.5 text-white focus:outline-none focus:border-cyan-400">`;
          } else {
            td.innerText = row[day] || '-';
          }
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
      updateShiftButtons();
    }

    // Automatska provera vremena za noćni režim u 21:00h
    function checkEveningTask() {
      const now = new Date();
      const hours = now.getHours();
      const bodyTag = document.getElementById('main-body');
      const nightIndicator = document.getElementById('night-mode-indicator');

      // Ako je između 21:00h i 06:00h ujutru -> prebaci u noćnu temu
      if (hours >= 21 || hours < 6) {
        bodyTag.style.background = "linear-gradient(135deg, #020617 0%, #090d16 50%, #020617 100%)";
        if (nightIndicator) nightIndicator.innerText = "🌙 Noćni režim";
      } else {
        bodyTag.style.background = "linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%)";
        if (nightIndicator) nightIndicator.innerText = "";
      }
    }
    
    // Proveri odmah pri učitavanju i pokreni proveru na svakih 60 sekundi
    setInterval(checkEveningTask, 60000);

    // Inicijalno pokretanje
    listenToFirebase();
    renderTable();
    
    window.addEventListener('DOMContentLoaded', () => {
      checkEveningTask();
      updateShiftButtons();
    });
  </script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      transition: background 1s ease;
    }
  </style>
</head>
<body id="main-body" class="text-slate-100 p-4 md:p-8 flex flex-col justify-between">

  <div class="max-w-5xl mx-auto w-full">
    
    <!-- Zaglavlje -->
    <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            Распоред Часова 
          </h1>
          <span id="night-mode-indicator" class="text-xs font-semibold text-indigo-300 bg-indigo-950/60 border border-indigo-800/50 px-2.5 py-1 rounded-full"></span>
        </div>
        <p class="text-slate-400 text-sm mt-1">
          II/4 за школску годину 2026/2027 • <span class="text-cyan-400 font-semibold">ИВА ДИМИТРИЈЕВИЋ</span>
        </p>
      </div>

      <div class="flex items-center gap-3">
        <span id="adminStatus" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
          Korisnički pregled
        </span>
        <button onclick="window.openAdminModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 transition-all">
          🔑 Admin Login
        </button>
      </div>
    </header>

    <!-- Kontrole smene -->
    <div class="flex justify-between items-center mb-6 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800 backdrop-blur-md">
      <div class="flex gap-1">
        <button id="btnPrepodne" onclick="window.switchShift('prepodne')" class="px-5 py-2 rounded-xl text-sm font-semibold bg-cyan-500 text-slate-900 shadow-lg shadow-cyan-500/30 transition-all">
          ☀️ Pre podne
        </button>
        <button id="btnPoslepodne" onclick="window.switchShift('poslepodne')" class="px-5 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:text-white transition-all">
          🌙 Posle podne
        </button>
      </div>
    </div>

    <!-- Tabela rasporeda -->
    <div class="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/40 backdrop-blur-md shadow-2xl">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-800 bg-slate-900/80 text-xs font-bold uppercase tracking-wider text-slate-400">
            <th class="p-4">Време / Час</th>
            <th class="p-4 border-l border-slate-800">Ponedeljak</th>
            <th class="p-4 border-l border-slate-800">Utorak</th>
            <th class="p-4 border-l border-slate-800">Sreda</th>
            <th class="p-4 border-l border-slate-800">Četvrtak</th>
            <th class="p-4 border-l border-slate-800">Petak</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dinamički podaci -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-2">Admin Prijava</h3>
      <p class="text-xs text-slate-400 mb-4">Unesite PIN kod za izmenu rasporeda:</p>
      
      <input type="password" id="adminPin" placeholder="Unesite PIN" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white mb-4 focus:outline-none focus:border-cyan-500">
      
      <div class="flex gap-2">
        <button onclick="window.closeAdminModal()" class="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium text-slate-300">
          Otkaži
        </button>
        <button onclick="window.loginAdmin()" class="w-1/2 py-2.5 bg-cyan-500 hover:bg-cyan-400 rounded-xl text-sm font-bold text-slate-900 shadow-lg shadow-cyan-500/20">
          Prijavi se
        </button>
      </div>
    </div>
  </div>

  <!-- Podnožje -->
  <footer class="mt-8 text-center text-xs text-slate-500">
    Aplikacija za interaktivni raspored časova • Sinhronizovano preko Firebase-a
  </footer>

</body>
</html>
